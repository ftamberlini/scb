[project]
name = "scb"
version = "0.1.0"
description = "Brazilian cinema box-office dashboard backed by ANCINE Parquet data"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb>=1.3,<2",
    "fastapi>=0.116,<1",
    "langchain>=1,<2",
    "langchain-anthropic>=1,<2",
    "langchain-deepseek>=1,<2",
    "langchain-google-genai>=3,<5",
    "langchain-openai>=1,<2",
    "python-dotenv>=1.1,<2",
    "sqlglot>=27,<30",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "pytest-cov>=6.2,<8",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"app/server.py" = ["E402", "E702"]
